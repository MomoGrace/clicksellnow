<!doctype html><html><head><meta charset='utf-8'><title>Merge PDF - ClickSellNow</title><link rel='stylesheet' href='styles.css'><script src='https://unpkg.com/pdf-lib/dist/pdf-lib.min.js'></script></head><body><header><div class='nav'><a class='logo' href='index.html'>ClickSellNow</a><nav><a href='index.html'>Tools</a><a href='guides.html'>Guides</a></nav></div></header><main class='container'><h1>Merge PDF</h1><div class='card'><div id='drop' class='drop'>Drag and drop PDF files<input id='file' type='file' accept='application/pdf' multiple></div><div id='list'></div><button class='btn' id='run'>Merge PDFs</button> <button class='btn secondary' id='clear'>Clear</button><div id='status' class='status' style='display:none'></div><div id='downloadWrap' style='display:none;margin-top:12px'><a id='downloadLink' class='btn'>Download merged PDF</a></div><p class='small'>Privacy: files are processed in your browser and not uploaded to our servers.</p></div><div class='card'><h3>FAQ</h3><p><b>Is this free?</b> Yes.</p><p><b>File limit?</b> Depends on your device memory.</p><h3>Related tools</h3><a href='split-pdf.html'>Split PDF</a> · <a href='rotate-pdf.html'>Rotate PDF</a></div></main><script src='app.js'></script><script>const f=CSN.el('file'),d=CSN.el('drop'),l=CSN.el('list');let files=[];function render(){l.innerHTML=files.map((x,i)=>`<div class='file-item'>${x.name}<button onclick='removeFile(${i})'>Remove</button></div>`).join('')}window.removeFile=i=>{files.splice(i,1);render()};function add(fs){files=[...files,...[...fs].filter(x=>x.type==='application/pdf')];render();CSN.setStatus(files.length?`${files.length} file(s) ready.`:'No PDF files selected.','info')}f.onchange=e=>add(e.target.files);['dragover','dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();if(ev==='dragover')d.classList.add('drag');if(ev==='dragleave'||ev==='drop')d.classList.remove('drag');if(ev==='drop')add(e.dataTransfer.files)}));CSN.el('clear').onclick=()=>{files=[];render();CSN.clearStatus();CSN.el('downloadWrap').style.display='none'};CSN.el('run').onclick=async()=>{try{if(files.length<2)throw new Error('Please add at least 2 PDF files.');CSN.setStatus('Merging files...','info');const out=await PDFLib.PDFDocument.create();for(const file of files){const b=await file.arrayBuffer();const src=await PDFLib.PDFDocument.load(b);const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));}const bytes=await out.save();CSN.setDownload('merged.pdf',new Blob([bytes],{type:'application/pdf'}));CSN.setStatus('Merge complete.','success')}catch(e){CSN.setStatus(e.message,'error')}};</script></body></html>
